name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Lint already ran above.
      - run: npx next build --no-lint
      # Next only runs instrumentation from the expected place; fail if it moves.
      - run: test -f .next/server/instrumentation.js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-e2e-${{ hashFiles('package-lock.json') }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Supabase (database, auth and the Mailpit inbox) in Docker, with the
      # migrations applied. Only what the app uses is started. It runs in the
      # background while the browser installs.
      - run: |
          nohup sh -c 'npx supabase start; echo $? > supabase-start.tmp; mv supabase-start.tmp supabase-start.rc' > supabase-start.log 2>&1 &
      - run: npx playwright install --with-deps chromium
      - name: Wait for Supabase
        run: |
          timeout 600 sh -c 'until [ -f supabase-start.rc ]; do sleep 2; done' || true
          cat supabase-start.log
          [ "$(cat supabase-start.rc 2> /dev/null)" = 0 ]
      - run: npm run e2e
      - if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            supabase-start.log
          retention-days: 7
